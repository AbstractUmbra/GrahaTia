[project]
name = "Graha-Tia"
version = "0.0.1"
description = "A helper bot for organizing your FFXIV needs."
authors = [{ name = "Alex Nørgaard", email = "umbra@abstractumbra.dev" }]
dependencies = [
    "asyncpg",
    "beautifulsoup4",
    "discord-ext-menus @ git+https://github.com/Rapptz/discord-ext-menus@master",
    "discord-py[speed] @ git+https://github.com/Rapptz/discord.py.git@master",
    "jishaku",
    "lru-dict",
    "lxml",
    "parsedatetime",
    "psutil",
    "pygit2",
    "python-dateutil",
]
requires-python = "<4.0,>=3.13"
readme = "README.md"
license = { text = "MPL2.0" }

[dependency-groups]
dev = ["ruff", "typing-extensions", "asyncpg-stubs"]
speed = ["orjson", "uvloop; sys_platform != 'win32'"]

[tool.uv.workspace]
members = ["webserver/"]

[tool.uv.sources]
webserver = { workspace = true }

[tool.ruff]
line-length = 125
target-version = "py313"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "any-type",
    "async-function-with-timeout",                 # dpy commonly uses this parameter
    "blocking-path-method-in-async-function",      # i don't like trio/anyio
    "complex-structure",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",                                           # not needed here
    "DOC",
    "raw-string-in-exception",                     # in this case this is okay
    "unused-import",
    "import-shadowed-by-loop-var",
    "undefined-local-with-import-star",
    "undefined-local-with-import-star-usage",
    "implicit-namespace-package",                  # due to how I load modules this results in annoyances
    "pandas-use-of-dot-values",                    # this is not a numpy codebase
    "try-except-in-loop",
    "useless-import-alias",                        # pyright ruling for `as` imports needed
    "too-many-branches",
    "too-many-arguments",
    "magic-value-comparison",                      # I hate this rule
    "no-self-use",
    "bad-quotes-inline-string",
    "ambiguous-unicode-character-string",
    "function-call-in-dataclass-default-argument",
    "non-empty-init-module",                       # we do some stuff here
    "assert",                                      # assert is used for type checking in this codebase
    "private-member-access",
    "suppressible-exception",
    "raise-vanilla-args",                          # over-eager rule
    "raise-within-try",                            # unrealistic rule
    "extraneous-parentheses",
]
unfixable = [
    "line-too-long", # line length handled in other ways by ruff format
    "ERA",           # Don't delete commented out code
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# https://discuss.python.org/t/problems-with-typeis/55410/6
# https://discuss.python.org/t/problems-with-typeis/55410/46
# Until what can go into a TypeIs/TypeGuard changes, these are just dangerous.
"typing.TypeIs".msg = "TypeIs is fundamentally unsafe, even when using it as described to be safe"
"typing.TypeGuard".msg = "TypeGuard is fundamentally unsafe"
"typing_extensions.TypeIs".msg = "TypeIs is fundamentally unsafe, even when using it as described to be safe"
"typing_extensions.TypeGuard".msg = "TypeGuard is fundamentally unsafe"
"typing.runtime_checkable".msg = "Runtime checkable is fundamentally unsafe."
"typing_extensions.runtime_checkable".msg = "Runtime checkable is fundamentally unsafe."
# these don't work as deferred imports, intentionally, because type checkers are dumb
# and require they be imported directly from typing to work, this breaks the deferred re-export.
"typing.Final".msg = "see https://github.com/microsoft/pyright/issues/9664#issuecomment-2574042580"
"typing_extensions.Final".msg = "see https://github.com/microsoft/pyright/issues/9664#issuecomment-2574042580"
"typing.final".msg = "see https://github.com/microsoft/pyright/issues/9664#issuecomment-2574042580"
"typing_extensions.final".msg = "see https://github.com/microsoft/pyright/issues/9664#issuecomment-2574042580"

[tool.ruff.lint.per-file-ignores]
"utilities/flags.py" = ["no-self-use"]
"extensions/__init__.py" = [
    "non-empty-init-module",
] # we do magic in here for ext loading

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-import-conventions.aliases]
"concurrent.futures" = "cf"

[tool.pyright]
include = ["bot.py", "utilities/**/*.py", "extensions/**/*.py"]
useLibraryCodeForTypes = true
typeCheckingMode = "basic"
pythonVersion = "3.13"
pythonPlatform = "All"
reportDuplicateImport = "error"
reportGeneralTypeIssues = "error"
reportMissingImports = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUntypedFunctionDecorator = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
strictDictionaryInference = true
strictListInference = true
strictParameterNoneValue = true
strictSetInference = true
